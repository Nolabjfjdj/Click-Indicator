name: Build Click Indicator

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: iOS
